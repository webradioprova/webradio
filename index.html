<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Prova - Radio Promoter Network</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    /* Contenitore relativo per posizionare il logo sopra l'iframe */
    .player-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Stile Iframe */
    .player-wrapper iframe {
      width: 100%;
      height: 380px;
      border: none;
      border-radius: 12px;
    }

    /* Maschera con il tuo logo */
    .logo-overlay {
      position: absolute;
      top: 55px; /* Regola se necessario alzare o abbassare il logo */
      left: 50%;
      transform: translateX(-50%);
      width: 150px; /* Dimensione della maschera per coprire 4U */
      height: 150px;
      border-radius: 50%;
      background-image: url('webradioprovalogo.jpeg');
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
      pointer-events: none; /* Lascia passare i clic ai tasti sottostanti */
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="player-wrapper">
      <div class="logo-overlay"></div>
      <iframe src="https://eu8.fastcast4u.com/start/webradioprova/"></iframe>
    </div>
  </div>

</body>
</html>
