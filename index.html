<script>
  const player = document.getElementById('radio-player');
  const playBtn = document.getElementById('play-btn');
  const volumeSlider = document.getElementById('volume-slider');
  const volMuteBtn = document.getElementById('vol-mute-btn');
  const volMaxBtn = document.getElementById('vol-max-btn');
  const shareBtn = document.getElementById('share-btn');
  const coverImg = document.getElementById('cover-img');
  const mainCard = document.querySelector('.main-card');
  const liveText = document.getElementById('live-text');
  const trackTitleEl = document.getElementById('track-title');

  const DEFAULT_LOGO = 'webradioprovalogo.jpeg';
  let previousVolume = 0.8;
  let currentTrack = '';

  const streams = [
    "https://eu8.fastcast4u.com/proxy/webradioprova?mp=/stream",
    "http://eu8.fastcast4u.com:4796/;",
    "https://radio.hazteunsitio.net/streams/rosario_7c1a7d"
  ];
  let currentStreamIndex = 0;

  player.src = streams[currentStreamIndex];

  playBtn.addEventListener('click', () => {
    if (player.paused) {
      player.play().then(() => {
        playBtn.textContent = '❚❚';
        mainCard.classList.add('playing');
        liveText.textContent = 'IN DIRETTA';
      }).catch(err => {
        console.log("Errore di riproduzione:", err);
        switchToNextStream();
      });
    } else {
      player.pause();
      playBtn.textContent = '▶';
      mainCard.classList.remove('playing');
      liveText.textContent = 'IN PAUSA';
    }
  });

  function switchToNextStream() {
    currentStreamIndex++;
    if (currentStreamIndex < streams.length) {
      console.warn("Passaggio al flusso di backup n. " + (currentStreamIndex + 1));
      player.src = streams[currentStreamIndex];
      player.load();
      player.play().then(() => {
        playBtn.textContent = '❚❚';
        mainCard.classList.add('playing');
        liveText.textContent = 'IN DIRETTA (BACKUP)';
      }).catch(e => {
        console.log("Errore backup:", e);
        switchToNextStream();
      });
    } else {
      console.error("Tutti i flussi sono offline.");
      liveText.textContent = 'OFFLINE';
      mainCard.classList.remove('playing');
      playBtn.textContent = '▶';
    }
  }

  player.addEventListener('error', switchToNextStream);

  volumeSlider.addEventListener('input', (e) => {
    player.volume = e.target.value;
    if (e.target.value > 0) {
      previousVolume = e.target.value;
      volMuteBtn.textContent = '🔈';
    } else {
      volMuteBtn.textContent = '🔇';
    }
  });

  volMuteBtn.addEventListener('click', () => {
    if (player.volume > 0) {
      previousVolume = player.volume;
      player.volume = 0;
      volumeSlider.value = 0;
      volMuteBtn.textContent = '🔇';
    } else {
      player.volume = previousVolume || 0.8;
      volumeSlider.value = player.volume;
      volMuteBtn.textContent = '🔈';
    }
  });

  volMaxBtn.addEventListener('click', () => {
    player.volume = 1;
    volumeSlider.value = 1;
    previousVolume = 1;
    volMuteBtn.textContent = '🔈';
  });

  shareBtn.addEventListener('click', () => {
    if (navigator.share) {
      navigator.share({
        title: 'Web Radio Prova',
        text: 'Ascolta Web Radio Prova in diretta streaming!',
        url: window.location.href
      }).catch(err => console.log('Condivisione annullata'));
    } else {
      navigator.clipboard.writeText(window.location.href).then(() => {
        const originalText = shareBtn.textContent;
        shareBtn.textContent = '✓ Link Copiato!';
        setTimeout(() => {
          shareBtn.textContent = originalText;
        }, 2000);
      });
    }
  });

  async function fetchCoverArt(query) {
    try {
      const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&limit=1`);
      const data = await response.json();
      if (data.results && data.results.length > 0) {
        return data.results[0].artworkUrl100.replace('100x100bb', '300x300bb');
      }
    } catch (err) {
      console.log('Impossibile recuperare la copertina:', err);
    }
    return DEFAULT_LOGO;
  }

  // Aggiorna il testo del marquee e riavvia l'animazione per evitare che resti bloccata
  function updateMarqueeText(text) {
    trackTitleEl.textContent = text;
    // forza restart animazione
    trackTitleEl.style.animation = 'none';
    requestAnimationFrame(() => {
      trackTitleEl.style.animation = ''; // usa il valore definito nel CSS (marquee-anim)
    });
  }

  // Funzione con timeout sicuro (3s) e anti-cache (timestamp+random)
  async function updateNowPlaying() {
    // Se vuoi un fallback immediato prima della chiamata (facoltativo), commenta la riga seguente:
    // updateMarqueeText("Caricamento brano in corso...");

    const controller = new AbortController();
    const TIMEOUT_MS = 3000;
    const timeoutId = setTimeout(() => {
      // abort della fetch se supera TIMEOUT_MS
      try { controller.abort(); } catch (e) {}
      // fallback immediato visibile all'utente
      updateMarqueeText("Web Radio Prova - In diretta");
    }, TIMEOUT_MS);

    try {
      const antiCache = Date.now() + '_' + Math.random();
      const url = 'https://eu8.fastcast4u.com/rpc/webradioprova/streaminfo.get?_t=' + antiCache;

      const response = await fetch(url, {
        cache: 'no-store',
        headers: { 'Accept': 'application/json' },
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      // Se la risposta non è OK o non è JSON, fallback
      if (!response.ok) {
        updateMarqueeText("Web Radio Prova - In diretta");
        return;
      }

      const data = await response.json();

      if (data && data.type === 'result' && data.data && data.data[0]) {
        const info = data.data[0];
        let songRaw = (info.song || info.title || '').toString();

        if (songRaw.toLowerCase().includes('autodj') || songRaw.toLowerCase().includes('presentazione')) {
          const defaultDisplay = "Le quattro stagioni, Op. 8 - Antonio Vivaldi - La Primavera - The Modena Chamber Orchestra";
          if (defaultDisplay !== currentTrack) {
            currentTrack = defaultDisplay;
            updateMarqueeText(defaultDisplay);
            document.title = `${defaultDisplay} | Web Radio Prova`;
            coverImg.src = DEFAULT_LOGO;
          }
          return;
        }

        let album = (info.album || "Le quattro stagioni, Op. 8").toString();
        let title = songRaw;
        let autore = "Antonio Vivaldi";
        let orchestra = "The Modena Chamber Orchestra";

        let cleanTitle = title
          .replace(/Antonio Vivaldi\s*-\s*/gi, '')
          .replace(/Le quattro stagioni[^\-]*-?\s*/gi, '')
          .replace(/^[\-\s]+/, '')
          .trim();

        if (!cleanTitle) cleanTitle = title.trim();

        // rimuove eventuali occorrenze del nome dell'orchestra dalle altre parti
        const orchestraRegex = new RegExp(orchestra.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
        album = (album || '').replace(orchestraRegex, '').trim();
        autore = (autore || '').replace(orchestraRegex, '').trim();
        cleanTitle = (cleanTitle || '').replace(orchestraRegex, '').replace(/^[\-\s]+/, '').trim();

        if (!cleanTitle) cleanTitle = (title || '').replace(orchestraRegex, '').trim();

        // costruisce la stringa nella sequenza richiesta: Album - Autore - Titolo - Orchestra
        let songString = [album, autore, cleanTitle, orchestra].filter(p => p && p.length > 0).join(' - ');
        songString = songString.replace(/\s*-\s*-+\s*/g, ' - ').replace(/\s{2,}/g, ' ').trim();

        if (songString && songString !== currentTrack) {
          currentTrack = songString;
          updateMarqueeText(songString);
          document.title = `${songString} | Web Radio Prova`;

          const lowerSong = songString.toLowerCase();
          if (lowerSong.includes('web radio') || lowerSong.includes('presentazione') || lowerSong.includes('station id') || lowerSong.includes('jingle')) {
            coverImg.src = DEFAULT_LOGO;
          } else {
            const coverUrl = await fetchCoverArt(songString);
            coverImg.src = coverUrl;
          }
        }
      } else {
        // se payload vuoto, fallback leggibile
        updateMarqueeText("Web Radio Prova - In diretta");
      }
    } catch (error) {
      // fetch fallita o abort (timeout)
      console.log('Errore/timeout fetch streaminfo.get:', error);
      updateMarqueeText("Web Radio Prova - In diretta");
    } finally {
      clearTimeout(timeoutId);
    }
  }

  async function initVisitorCounter() {
    const visitCountEl = document.getElementById('visit-count');
    try {
      const response = await fetch('https://countapi.mileshilliard.com/api/v1/hit/webradioprova_global_counter');
      if (response.ok) {
        const data = await response.json();
        if (data && data.value !== undefined) {
          visitCountEl.textContent = data.value;
          return;
        }
      }
    } catch (e) {
      console.log('Errore contatore:', e);
    }
    if (visitCountEl.textContent === '...') {
      visitCountEl.textContent = '--';
    }
  }

  // Primo avvio immediato, poi ogni 5 secondi
  updateNowPlaying();
  setInterval(updateNowPlaying, 5000);
  initVisitorCounter();
</script>
