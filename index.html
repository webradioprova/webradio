<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Radio Scuola - Ascolta la Diretta</title>
    <!-- Framework Grafico Tailwind CSS e Icone FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 0.4; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-ring { animation: pulse-ring 3s infinite ease-in-out; }
        
        .bar { animation: soundBar 1.2s infinite ease-in-out alternate; }
        .bar:nth-child(1) { animation-delay: 0.1s; }
        .bar:nth-child(2) { animation-delay: 0.4s; }
        .bar:nth-child(3) { animation-delay: 0.2s; }
        .bar:nth-child(4) { animation-delay: 0.5s; }
        
        @keyframes soundBar {
            0% { height: 4px; }
            100% { height: 28px; }
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <!-- Sfondo Sfumato -->
    <div class="fixed inset-0 bg-gradient-to-br from-indigo-950 via-slate-900 to-slate-950 -z-10"></div>

    <!-- Scheda Player Principale -->
    <main class="w-full max-w-md bg-slate-900/80 glass-panel rounded-3xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
        
        <!-- Header con Stato e Condivisione -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center space-x-2">
                <span id="status-dot" class="w-3 h-3 rounded-full bg-slate-500"></span>
                <span id="status-text" class="text-xs font-semibold uppercase tracking-wider text-slate-400">IN PAUSA</span>
            </div>
            <button id="share-btn" class="p-2 rounded-full hover:bg-white/10 text-slate-400 hover:text-white transition-colors" title="Condividi">
                <i class="fa-solid fa-share-nodes text-lg"></i>
            </button>
        </div>

        <!-- Logo / Icona Radio -->
        <div class="relative w-48 h-48 mx-auto mb-8 flex items-center justify-center">
            <div id="ring-animation" class="absolute inset-0 rounded-full bg-indigo-500/20 hidden animate-pulse-ring"></div>
            <div class="w-44 h-44 rounded-full bg-slate-800 border-2 border-indigo-500/30 flex items-center justify-center shadow-inner overflow-hidden relative">
                <i class="fa-solid fa-radio text-6xl text-indigo-400"></i>
            </div>
        </div>

        <!-- Titoli Personalizzabili -->
        <div class="text-center mb-6">
            <h1 id="radio-title" class="text-2xl font-bold text-white tracking-wide">Web Radio Prova</h1>
            <p id="radio-subtitle" class="text-sm text-slate-400 mt-1">La voce dell'Istituto Comprensivo</p>
        </div>

        <!-- Equalizzatore Grafico (Animato durante la riproduzione) -->
        <div id="visualizer" class="flex items-center justify-center gap-1.5 h-8 mb-6 opacity-30 transition-opacity duration-300">
            <div class="bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
            <div class="bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
            <div class="bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
            <div class="bar w-1.5 bg-indigo-400 rounded-full h-2"></div>
        </div>

        <!-- Pulsante Play / Stop -->
        <div class="flex justify-center mb-8">
            <button id="play-btn" class="w-20 h-20 rounded-full bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 transition-all duration-200">
                <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
            </button>
        </div>

        <!-- Controllo Volume -->
        <div class="flex items-center space-x-3 bg-slate-800/50 p-3 rounded-2xl mb-6">
            <button id="mute-btn" class="text-slate-400 hover:text-white transition-colors">
                <i id="volume-icon" class="fa-solid fa-volume-high"></i>
            </button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" class="w-full accent-indigo-500 cursor-pointer h-1.5 bg-slate-700 rounded-lg appearance-none">
        </div>

        <!-- Avviso di Connessione -->
        <div id="error-message" class="hidden text-center text-xs text-rose-400 bg-rose-950/40 p-2 rounded-lg border border-rose-800/30 mb-4">
            Impossibile collegarsi allo streaming. Verifica che la radio sia trasmessa live.
        </div>

        <!-- Footer -->
        <footer class="text-center text-xs text-slate-500 pt-4 border-t border-slate-800">
            Progetto Radio Scuola &copy; <span id="year"></span>
        </footer>

    </main>

    <!-- Tag Audio HTML5 -->
    <audio id="audio-player" preload="none"></audio>

    <script>
        // =========================================================
        // CONFIGURAZIONE CANALE - UNICO PUNTO DA MODIFICARE IN FUTURO
        // =========================================================
        const CONFIG = {
            // Indirizzo stream audio del server
            STREAM_URL: "https://eu8.fastcast4u.com/stream/webradioprova/;",
            
            RADIO_NAME: "Web Radio Prova",
            RADIO_SUBTITLE: "La voce dell'Istituto Comprensivo"
        };
        // =========================================================

        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const visualizer = document.getElementById('visualizer');
        const ringAnimation = document.getElementById('ring-animation');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeIcon = document.getElementById('volume-icon');
        const muteBtn = document.getElementById('mute-btn');
        const errorMessage = document.getElementById('error-message');
        const shareBtn = document.getElementById('share-btn');

        document.getElementById('radio-title').textContent = CONFIG.RADIO_NAME;
        document.getElementById('radio-subtitle').textContent = CONFIG.RADIO_SUBTITLE;
        document.getElementById('year').textContent = new Date().getFullYear();

        let isPlaying = false;
        let previousVolume = 0.8;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                playStream();
            } else {
                pauseStream();
            }
        });

        function playStream() {
            errorMessage.classList.add('hidden');
            audio.src = CONFIG.STREAM_URL;
            audio.load();
            
            statusText.textContent = "Connessione...";
            statusDot.className = "w-3 h-3 rounded-full bg-amber-400 animate-ping";

            audio.play().then(() => {
                isPlaying = true;
                playIcon.className = "fa-solid fa-pause text-2xl";
                statusText.textContent = "IN ONDA";
                statusDot.className = "w-3 h-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                visualizer.classList.remove('opacity-30');
                visualizer.classList.add('opacity-100');
                ringAnimation.classList.remove('hidden');
            }).catch(err => {
                console.error("Errore audio:", err);
                resetUI();
                errorMessage.classList.remove('hidden');
            });
        }

        function pauseStream() {
            audio.pause();
            audio.src = "";
            resetUI();
        }

        function resetUI() {
            isPlaying = false;
            playIcon.className = "fa-solid fa-play text-2xl ml-1";
            statusText.textContent = "IN PAUSA";
            statusDot.className = "w-3 h-3 rounded-full bg-slate-500";
            visualizer.classList.add('opacity-30');
            visualizer.classList.remove('opacity-100');
            ringAnimation.classList.add('hidden');
        }

        volumeSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            audio.volume = val;
            updateVolumeIcon(val);
        });

        muteBtn.addEventListener('click', () => {
            if (audio.volume > 0) {
                previousVolume = audio.volume;
                audio.volume = 0;
                volumeSlider.value = 0;
                updateVolumeIcon(0);
            } else {
                audio.volume = previousVolume;
                volumeSlider.value = previousVolume;
                updateVolumeIcon(previousVolume);
            }
        });

        function updateVolumeIcon(val) {
            if (val == 0) {
                volumeIcon.className = "fa-solid fa-volume-xmark";
            } else if (val < 0.5) {
                volumeIcon.className = "fa-solid fa-volume-low";
            } else {
                volumeIcon.className = "fa-solid fa-volume-high";
            }
        }

        shareBtn.addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: CONFIG.RADIO_NAME,
                    text: 'Ascolta la nostra Web Radio!',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Link della pagina copiato negli appunti!");
            }
        });
    </script>
</body>
</html>
