<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Prova - Radio Promoter Network & Circuito</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 450px;
    }

    /* Contenitore relativo per consentire il posizionamento assoluto del logo */
    .player-wrapper {
      position: relative;
      width: 100%;
      margin-top: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Stile Iframe */
    .player-wrapper iframe {
      width: 100%;
      height: 380px;
      border: none;
      border-radius: 12px;
    }

    /* Maschera di sovrapposizione logo */
    .logo-overlay {
      position: absolute;
      top: 50px; /* Regola l'altezza se necessario */
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background-image: url('logo.jpg'); /* Verifica il nome esatto dell'immagine caricata */
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.6);
      pointer-events: none; /* Lascia passare i click all'iframe sottostante */
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="player-wrapper">
      <div class="logo-overlay"></div>
      <iframe src="https://eu8.fastcast4u.com/player/webradioprova/"></iframe>
    </div>
  </div>

</body>
</html>
