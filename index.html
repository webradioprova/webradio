<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Prova - Radio Promoter Network</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    /* Player audio nativo HTML5 integrato direttamente */
    .audio-container {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-img {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      border: 3px solid #3a506b;
    }

    audio {
      width: 100%;
      max-width: 350px;
      border-radius: 30px;
      outline: none;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="audio-container">
      <!-- Logo caricato sul tuo GitHub -->
      <img src="webradioprovalogo.jpeg" alt="Web Radio Prova" class="logo-img">
      
      <!-- Flusso audio diretto dal server Centova Cast/FastCast4u -->
      <audio controls autoplay>
        <source src="http://eu8.fastcast4u.com:4796/;" type="audio/mpeg">
        Il tuo browser non supporta il lettore audio.
      </audio>
    </div>
  </div>

</body>
</html>
