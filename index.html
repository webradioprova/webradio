  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 24px;
      padding: 30px 25px 25px 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    /* Badge Visite in Alto a Destra */
    .views-badge {
      position: absolute;
      top: 18px;
      right: 20px;
      background-color: rgba(11, 19, 43, 0.7);
      border: 1px solid #3a506b;
      color: #4ea8de;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Badge LIVE */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(11, 19, 43, 0.8);
      border: 1px solid #3a506b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #a0aec0;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #718096;
      transition: background-color 0.3s ease;
    }

    /* Stato IN DIRETTA quando audio attivo */
    .playing .live-badge {
      border-color: #00f5d4;
      color: #ffffff;
      background-color: rgba(0, 245, 212, 0.12);
    }

    .playing .live-dot {
      background-color: #00f5d4;
      box-shadow: 0 0 10px #00f5d4;
      animation: pulse-green 1.5s infinite;
    }

    @keyframes pulse-green {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .audio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* Logo / Copertina Brano */
    .logo-wrapper {
      position: relative;
      display: inline-block;
      width: 140px;
      height: 140px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      border: 3px solid #3a506b;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .playing .logo-img {
      transform: scale(1.03);
      border-color: #4ea8de;
    }

    /* Sezione Info Brano */
    .now-playing {
      background-color: #0b132b;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #3a506b;
    }

    .now-playing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .now-playing-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4ea8de;
      font-weight: 700;
    }

    /* Pulsante Copia Brano */
    .copy-btn {
      background: rgba(58, 80, 107, 0.3);
      border: 1px solid #3a506b;
      color: #a0aec0;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      line-height: 1;
    }

    .copy-btn:hover {
      background-color: #3a506b;
      color: #ffffff;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.88rem;
      color: #a0aec0;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Pulsanti Ricerca Spotify / YouTube */
    .search-links {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      transition: opacity 0.3s ease;
    }

    .search-links.hidden {
      display: none;
    }

    .search-btn {
      font-size: 0.72rem;
      font-weight: 600;
      color: #a0aec0;
      background-color: rgba(58, 80, 107, 0.25);
      border: 1px solid #3a506b;
      padding: 5px 12px;
      border-radius: 14px;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .search-btn:hover {
      background-color: #3a506b;
      color: #ffffff;
    }

    .search-btn.spotify:hover {
      border-color: #1db954;
      color: #1db954;
    }

    .search-btn.youtube:hover {
      border-color: #ff0000;
      color: #ff0000;
    }

    /* Equalizzatore Grafico Animato */
    .equalizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      height: 22px;
      margin-top: 12px;
    }

    .equalizer .bar {
      width: 4px;
      height: 4px;
      background-color: #4ea8de;
      border-radius: 3px;
      transition: height 0.2s ease;
    }

    .playing .equalizer .bar {
      animation: bounce 1.2s infinite ease-in-out alternate;
    }

    .playing .equalizer .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .equalizer .bar:nth-child(2) { animation-delay: 0.4s; }
    .playing .equalizer .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .equalizer .bar:nth-child(4) { animation-delay: 0.5s; }
    .playing .equalizer .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { height: 4px; opacity: 0.5; }
      100% { height: 22px; opacity: 1; background-color: #00b4d8; }
    }
