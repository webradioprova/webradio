<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Prova - Radio Promoter Network</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 20px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    .audio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      border: 3px solid #3a506b;
    }

    /* Sezione Info Brano */
    .now-playing {
      background-color: #0b132b;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      margin-top: 5px;
      border: 1px solid #3a506b;
    }

    .now-playing-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #4ea8de;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.95rem;
      color: #a0aec0;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    audio {
      width: 100%;
      max-width: 350px;
      border-radius: 30px;
      outline: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="audio-container">
      <img src="webradioprovalogo.jpeg" alt="Web Radio Prova" class="logo-img">
      
      <!-- Box Titolo e Artista in tempo reale -->
      <div class="now-playing">
        <div class="now-playing-label">In onda ora</div>
        <div id="track-title" class="track-title">Caricamento brano...</div>
        <div id="track-artist" class="track-artist">Web Radio Prova</div>
      </div>

      <!-- Player Audio SSL Proxy -->
      <audio controls>
        <source src="https://eu8.fastcast4u.com/proxy/webradioprova?mp=/stream" type="audio/mpeg">
        <source src="http://eu8.fastcast4u.com:4796/;" type="audio/mpeg">
        Il tuo browser non supporta il lettore audio.
      </audio>
    </div>
  </div>

  <script>
    async function updateNowPlaying() {
      try {
        // Richiesta ai metadati JSON di Centova Cast
        const response = await fetch('https://eu8.fastcast4u.com/rpc/webradioprova/streaminfo.get');
        const data = await response.json();

        if (data && data.type === 'result' && data.data && data.data[0]) {
          const songInfo = data.data[0].song;
          
          if (songInfo) {
            // Se il metadato contiene "Artista - Titolo"
            if (songInfo.includes(' - ')) {
              const parts = songInfo.split(' - ');
              document.getElementById('track-artist').textContent = parts[0].trim();
              document.getElementById('track-title').textContent = parts.slice(1).join(' - ').trim();
            } else {
              document.getElementById('track-title').textContent = songInfo;
              document.getElementById('track-artist').textContent = 'Web Radio Prova';
            }
          }
        }
      } catch (error) {
        console.log('Errore nel recupero delle info del brano:', error);
      }
    }

    // Aggiorna subito e poi ogni 10 secondi
    updateNowPlaying();
    setInterval(updateNowPlaying, 10000);
  </script>

</body>
</html>
