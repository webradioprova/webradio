<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Prova - Radio Promoter Network</title>
  
  <!-- Favicon scheda browser -->
  <link rel="icon" type="image/jpeg" href="webradioprovalogo.jpeg">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 24px;
      padding: 35px 25px 25px 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
      width: 100%;
      max-width: 440px;
      position: relative;
      transition: box-shadow 0.5s ease;
    }

    /* Effetto alone fluorescente quando la radio è in play */
    .main-card.playing {
      box-shadow: 0 0 35px rgba(78, 168, 222, 0.3), 0 15px 35px rgba(0, 0, 0, 0.7);
    }

    /* Tasto Schermo Intero in alto a destra */
    .fullscreen-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      color: #a0aec0;
      font-size: 16px;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.2s ease;
    }

    .fullscreen-btn:hover {
      color: #4ea8de;
      transform: scale(1.15);
    }

    /* Badge LIVE */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(11, 19, 43, 0.8);
      border: 1px solid #3a506b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #a0aec0;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #718096;
      transition: background-color 0.3s ease;
    }

    /* Stato ON AIR / LIVE quando audio attivo */
    .playing .live-badge {
      border-color: #e63946;
      color: #ffffff;
      background-color: rgba(230, 57, 70, 0.15);
    }

    .playing .live-dot {
      background-color: #e63946;
      box-shadow: 0 0 10px #e63946;
      animation: pulse-red 1.5s infinite;
    }

    @keyframes pulse-red {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .audio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .logo-img {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      border: 3px solid #3a506b;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .playing .logo-img {
      transform: scale(1.03);
      border-color: #4ea8de;
    }

    /* Sezione Info Brano */
    .now-playing {
      background-color: #0b132b;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #3a506b;
    }

    .now-playing-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4ea8de;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #a0aec0;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Equalizzatore Grafico Animato */
    .equalizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      height: 25px;
      margin-top: 10px;
    }

    .equalizer .bar {
      width: 5px;
      height: 5px;
      background-color: #4ea8de;
      border-radius: 3px;
      transition: height 0.2s ease;
    }

    .playing .equalizer .bar {
      animation: bounce 1.2s infinite ease-in-out alternate;
    }

    .playing .equalizer .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .equalizer .bar:nth-child(2) { animation-delay: 0.4s; }
    .playing .equalizer .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .equalizer .bar:nth-child(4) { animation-delay: 0.5s; }
    .playing .equalizer .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { height: 5px; opacity: 0.5; }
      100% { height: 25px; opacity: 1; background-color: #00b4d8; }
    }

    /* Controlli Personalizzati */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      margin-top: 5px;
    }

    .play-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4ea8de, #0077b6);
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 20px rgba(78, 168, 222, 0.4);
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(78, 168, 222, 0.6);
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 80%;
      color: #a0aec0;
      font-size: 16px;
    }

    .volume-icon {
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .volume-icon:hover {
      transform: scale(1.2);
      color: #4ea8de;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 5px;
      background: #3a506b;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4ea8de;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Pulsante Condividi */
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(58, 80, 107, 0.4);
      border: 1px solid #3a506b;
      color: #a0aec0;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.2s ease;
    }

    .share-btn:hover {
      background: #3a506b;
      color: #ffffff;
      transform: translateY(-2px);
    }

    /* Footer Crediti FastCast4u */
    .footer-credits {
      margin-top: 15px;
      font-size: 0.72rem;
      color: #718096;
      letter-spacing: 0.8px;
    }

    .footer-credits a {
      color: #4ea8de;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .footer-credits a:hover {
      color: #00b4d8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <!-- Pulsante Fullscreen -->
    <button class="fullscreen-btn" id="fullscreen-btn" title="Schermo intero">⛶</button>

    <!-- Indicatore di Stato Live -->
    <div class="live-badge">
      <span class="live-dot"></span>
      <span id="live-text">OFFLINE</span>
    </div>

    <div class="audio-container" id="audio-container">
      <img src="webradioprovalogo.jpeg" alt="Web Radio Prova" class="logo-img">
      
      <!-- Box Titolo e Artista -->
      <div class="now-playing">
        <div class="now-playing-label">In onda ora</div>
        <div id="track-title" class="track-title">Caricamento brano...</div>
        <div id="track-artist" class="track-artist">Web Radio Prova</div>
        
        <!-- Equalizzatore a barre -->
        <div class="equalizer">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <!-- Controlli Audio Personalizzati -->
      <div class="controls">
        <button id="play-btn" class="play-btn" aria-label="Riproduci">▶</button>
        
        <div class="volume-container">
          <span id="vol-mute-btn" class="volume-icon" title="Silenzia/Ripristina audio">🔈</span>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
          <span id="vol-max-btn" class="volume-icon" title="Volume Massimo">🔊</span>
        </div>
      </div>

      <!-- Elemento Audio Nascosto -->
      <audio id="radio-player">
        <source src="https://eu8.fastcast4u.com/proxy/webradioprova?mp=/stream" type="audio/mpeg">
        <source src="http://eu8.fastcast4u.com:4796/;" type="audio/mpeg">
      </audio>
    </div>

    <!-- Tasto Condividi Radio -->
    <button class="share-btn" id="share-btn">🔗 Condividi Radio</button>

    <!-- Menzione FastCast4u -->
    <div class="footer-credits">
      Powered by <a href="https://fastcast4u.com" target="_blank" rel="noopener">FastCast4u</a>
    </div>
  </div>

  <script>
    const player = document.getElementById('radio-player');
    const playBtn = document.getElementById('play-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const volMuteBtn = document.getElementById('vol-mute-btn');
    const volMaxBtn = document.getElementById('vol-max-btn');
    const mainCard = document.querySelector('.main-card');
    const liveText = document.getElementById('live-text');
    const shareBtn = document.getElementById('share-btn');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    let previousVolume = 0.8;

    playBtn.addEventListener('click', () => {
      if (player.paused) {
        player.play().then(() => {
          playBtn.textContent = '❚❚';
          mainCard.classList.add('playing');
          liveText.textContent = 'IN DIRETTA';
        }).catch(err => {
          console.log("Errore di riproduzione:", err);
        });
      } else {
        player.pause();
        playBtn.textContent = '▶';
        mainCard.classList.remove('playing');
        liveText.textContent = 'IN PAUSA';
      }
    });

    // Controllo Slider Volume
    volumeSlider.addEventListener('input', (e) => {
      player.volume = e.target.value;
      if (e.target.value > 0) {
        previousVolume = e.target.value;
        volMuteBtn.textContent = '🔈';
      } else {
        volMuteBtn.textContent = '🔇';
      }
    });

    // Pulsante Mute
    volMuteBtn.addEventListener('click', () => {
      if (player.volume > 0) {
        previousVolume = player.volume;
        player.volume = 0;
        volumeSlider.value = 0;
        volMuteBtn.textContent = '🔇';
      } else {
        player.volume = previousVolume || 0.8;
        volumeSlider.value = player.volume;
        volMuteBtn.textContent = '🔈';
      }
    });

    // Pulsante Max Volume
    volMaxBtn.addEventListener('click', () => {
      player.volume = 1;
      volumeSlider.value = 1;
      previousVolume = 1;
      volMuteBtn.textContent = '🔈';
    });

    // Funzione Condividi
    shareBtn.addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: 'Web Radio Prova',
          text: 'Ascolta Web Radio Prova in diretta streaming!',
          url: window.location.href
        }).catch(err => console.log('Condivisione annullata'));
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link della radio copiato negli appunti!');
      }
    });

    // Toggle Schermo Intero
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen().catch(err => console.log(err));
      }
    });

    // Aggiornamento informazioni brano in onda
    async function updateNowPlaying() {
      try {
        const response = await fetch('https://eu8.fastcast4u.com/rpc/webradioprova/streaminfo.get');
        const data = await response.json();

        if (data && data.type === 'result' && data.data && data.data[0]) {
          const songInfo = data.data[0].song;
          let title = "Web Radio Prova";
          let artist = "Web Radio";
          
          if (songInfo) {
            if (songInfo.includes(' - ')) {
              const parts = songInfo.split(' - ');
              artist = parts[0].trim();
              title = parts.slice(1).join(' - ').trim();
            } else {
              title = songInfo;
              artist = 'Web Radio Prova';
            }
          }

          document.getElementById('track-title').textContent = title;
          document.getElementById('track-artist').textContent = artist;

          // Aggiorna notifica sistema / schermata di blocco
          if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: title,
              artist: artist,
              album: 'Web Radio Prova - Live Stream',
              artwork: [
                { src: 'webradioprovalogo.jpeg', sizes: '512x512', type: 'image/jpeg' }
              ]
            });
          }
        }
      } catch (error) {
        console.log('Errore info brano:', error);
      }
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 10000);
  </script>

</body>
</html>
