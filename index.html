<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Prova - Radio Promoter Network</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
      width: 100%;
      max-width: 440px;
    }

    .audio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .logo-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      border: 3px solid #3a506b;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .playing .logo-img {
      transform: scale(1.03);
      border-color: #4ea8de;
    }

    /* Sezione Info Brano */
    .now-playing {
      background-color: #0b132b;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #3a506b;
    }

    .now-playing-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4ea8de;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .track-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.9rem;
      color: #a0aec0;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Equalizzatore Grafico Animato */
    .equalizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      height: 25px;
      margin-top: 10px;
    }

    .equalizer .bar {
      width: 5px;
      height: 5px;
      background-color: #4ea8de;
      border-radius: 3px;
      transition: height 0.2s ease;
    }

    /* Animazione barre quando la radio suona */
    .playing .equalizer .bar {
      animation: bounce 1.2s infinite ease-in-out alternate;
    }

    .playing .equalizer .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .equalizer .bar:nth-child(2) { animation-delay: 0.4s; }
    .playing .equalizer .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .equalizer .bar:nth-child(4) { animation-delay: 0.5s; }
    .playing .equalizer .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { height: 5px; opacity: 0.5; }
      100% { height: 25px; opacity: 1; background-color: #00b4d8; }
    }

    /* Controlli Personalizzati */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      margin-top: 5px;
    }

    .play-btn {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4ea8de, #0077b6);
      border: none;
      color: white;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 20px rgba(78, 168, 222, 0.4);
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(78, 168, 222, 0.6);
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 80%;
      color: #a0aec0;
      font-size: 14px;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 5px;
      background: #3a506b;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4ea8de;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="audio-container" id="audio-container">
      <img src="webradioprovalogo.jpeg" alt="Web Radio Prova" class="logo-img">
      
      <!-- Box Titolo e Artista -->
      <div class="now-playing">
        <div class="now-playing-label">In onda ora</div>
        <div id="track-title" class="track-title">Caricamento brano...</div>
        <div id="track-artist" class="track-artist">Web Radio Prova</div>
        
        <!-- Equalizzatore a barre -->
        <div class="equalizer">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <!-- Controlli Audio Personalizzati -->
      <div class="controls">
        <button id="play-btn" class="play-btn" aria-label="Riproduci">▶</button>
        
        <div class="volume-container">
          <span>🔈</span>
          <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
          <span>🔊</span>
        </div>
      </div>

      <!-- Elemento Audio Nascosto -->
      <audio id="radio-player">
        <source src="https://eu8.fastcast4u.com/proxy/webradioprova?mp=/stream" type="audio/mpeg">
        <source src="http://eu8.fastcast4u.com:4796/;" type="audio/mpeg">
      </audio>
    </div>
  </div>

  <script>
    const player = document.getElementById('radio-player');
    const playBtn = document.getElementById('play-btn');
    const volumeSlider = document.getElementById('volume-slider');
    const container = document.getElementById('audio-container');

    playBtn.addEventListener('click', () => {
      if (player.paused) {
        player.play().then(() => {
          playBtn.textContent = '❚❚';
          container.classList.add('playing');
        }).catch(err => {
          console.log("Errore di riproduzione:", err);
        });
      } else {
        player.pause();
        playBtn.textContent = '▶';
        container.classList.remove('playing');
      }
    });

    volumeSlider.addEventListener('input', (e) => {
      player.volume = e.target.value;
    });

    async function updateNowPlaying() {
      try {
        const response = await fetch('https://eu8.fastcast4u.com/rpc/webradioprova/streaminfo.get');
        const data = await response.json();

        if (data && data.type === 'result' && data.data && data.data[0]) {
          const songInfo = data.data[0].song;
          
          if (songInfo) {
            if (songInfo.includes(' - ')) {
              const parts = songInfo.split(' - ');
              document.getElementById('track-artist').textContent = parts[0].trim();
              document.getElementById('track-title').textContent = parts.slice(1).join(' - ').trim();
            } else {
              document.getElementById('track-title').textContent = songInfo;
              document.getElementById('track-artist').textContent = 'Web Radio Prova';
            }
          }
        }
      } catch (error) {
        console.log('Errore info brano:', error);
      }
    }

    updateNowPlaying();
    setInterval(updateNowPlaying, 10000);
  </script>

</body>
</html>
