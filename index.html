<head>

  <meta property="og:site_name" content="Web Radio Prova">
  <meta property="og:title" content="Ascolta Web Radio Prova in Diretta">
  <meta property="og:description" content="Musica, programmi e dirette streaming su Web Radio Prova. Clicca per ascoltare!">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 24px;
      padding: 30px 25px 25px 25px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      text-align: center;
      width: 100%;
      max-width: 420px;
      position: relative;
    }

    .views-badge {
      position: absolute;
      top: 18px;
      right: 20px;
      background-color: rgba(11, 19, 43, 0.7);
      border: 1px solid #3a506b;
      color: #4ea8de;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.72rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: rgba(11, 19, 43, 0.8);
      border: 1px solid #3a506b;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #a0aec0;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #718096;
      transition: background-color 0.3s ease;
    }

    .playing .live-badge {
      border-color: #00f5d4;
      color: #ffffff;
      background-color: rgba(0, 245, 212, 0.12);
    }

    .playing .live-dot {
      background-color: #00f5d4;
      box-shadow: 0 0 10px #00f5d4;
      animation: pulse-green 1.5s infinite;
    }

    @keyframes pulse-green {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .audio-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .logo-wrapper {
      position: relative;
      display: inline-block;
      width: 140px;
      height: 140px;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.6);
      border: 3px solid #3a506b;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .playing .logo-img {
      transform: scale(1.03);
      border-color: #4ea8de;
    }

    .now-playing {
      background-color: #0b132b;
      width: 100%;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid #3a506b;
      overflow: hidden;
    }

    .now-playing-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #4ea8de;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
    }

    .marquee-container {
      width: 100%;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .track-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      display: inline-block;
      padding-left: 100%;
      animation: marquee-anim 18s linear infinite;
    }

    @keyframes marquee-anim {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }

    .equalizer {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 5px;
      height: 22px;
      margin-top: 12px;
    }

    .equalizer .bar {
      width: 4px;
      height: 4px;
      background-color: #4ea8de;
      border-radius: 3px;
      transition: height 0.2s ease;
    }

    .playing .equalizer .bar {
      animation: bounce 1.2s infinite ease-in-out alternate;
    }

    .playing .equalizer .bar:nth-child(1) { animation-delay: 0.1s; }
    .playing .equalizer .bar:nth-child(2) { animation-delay: 0.4s; }
    .playing .equalizer .bar:nth-child(3) { animation-delay: 0.2s; }
    .playing .equalizer .bar:nth-child(4) { animation-delay: 0.5s; }
    .playing .equalizer .bar:nth-child(5) { animation-delay: 0.3s; }

    @keyframes bounce {
      0% { height: 4px; opacity: 0.5; }
      100% { height: 22px; opacity: 1; background-color: #00b4d8; }
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      margin-top: 5px;
    }

    .play-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4ea8de, #0077b6);
      border: none;
      color: white;
      font-size: 26px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 20px rgba(78, 168, 222, 0.4);
      transition: all 0.2s ease;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(78, 168, 222, 0.6);
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 80%;
      color: #a0aec0;
      font-size: 16px;
    }

    .volume-icon {
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .volume-icon:hover {
      transform: scale(1.2);
      color: #4ea8de;
    }

    .volume-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 5px;
      background: #3a506b;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #4ea8de;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .volume-slider::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
