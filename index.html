<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Radio Prova - Radio Promoter Network</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b132b;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      background: #1c2541;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 480px;
    }

    /* Contenitore player con dimensioni fisse per calcolare la sovrapposizione */
    .player-wrapper {
      position: relative;
      width: 100%;
      height: 380px;
      overflow: hidden;
      border-radius: 12px;
    }

    /* Frame nativo di FastCast4u */
    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Maschera logo centrale per coprire il watermark 4U */
    .logo-overlay {
      position: absolute;
      top: 32%; /* Posizionamento verticale al centro della grafica */
      left: 50%;
      transform: translate(-50%, -50%);
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background-image: url('webradioprovalogo.jpeg');
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
      pointer-events: none; /* Permette ai clic sui tasti di passare al sotto */
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="player-wrapper">
      <div class="logo-overlay"></div>
      <iframe src="https://eu8.fastcast4u.com/player/webradioprova"></iframe>
    </div>
  </div>

</body>
</html>
